# Taster
binary_sensor:
  - platform: gpio
    name: "Button Left"
    pin:
      number: $pin_button_left
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
  #    on_press:
  #      then:
  #        - ehmtxv2.previous_screen: rgb8x24

  - platform: gpio
    name: "Button Right"
    pin:
      number: $pin_button_right
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
#    on_press:
#      then:
#        - ehmtxv2.next_screen: rgb8x24

font:
  #  - file: Calcium.ttf
  - file: mateine.ttf
    #  - file: gfonts://Roboto
    size: 12
    id: font_default
