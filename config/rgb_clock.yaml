substitutions:
  pin_leds: GPIO18
  pin_buzzer: GPIO16
  pin_battery: GPIO33
  pin_power: GPIO34
  pin_button_left: GPIO26
  pin_button_right: GPIO14
  pin_sda: GPIO21
  pin_scl: GPIO22
  mic_lrclk_pin: GPIO25 # left/right --> GND
  mic_bclk_pin: GPIO27 # CLK
  mic_din_pin: GPIO32 # SD

esphome:
  name: clock
  #  comment:
  friendly_name: esp
  name_add_mac_suffix: true
  project:
    name: esphome.clock
    version: "1.0"
  on_boot:
    then:
      ds1307.read_time:

esp32:
  board: esp32dev

