switch:
  - platform: template
    name: "Display"
    id: displaycontrol
    icon: "mdi:power"
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(rgb8x24)->show_display;
    turn_on_action:
      lambda: |-
        id(rgb8x24)->set_display_on();
    turn_off_action:
      lambda: |-
        id(rgb8x24)->set_display_off();

number:
  - platform: template
    name: "Brightness"
    id: display_brightness
    min_value: 30
    max_value: 150
    update_interval: 1s
    step: 5
    optimistic: true
    #    lambda: |-
    #      return id(rgb8x24)->get_brightness();
    on_value:
      lambda: |-
        id(rgb8x24)->set_brightness(x);

