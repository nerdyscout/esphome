substitutions:
  pin_leds: GPIO17
  pin_buzzer: GPIO16
  pin_battery: GPIO34
  pin_button_left: GPIO36
  pin_button_right: GPIO35
  pin_sda: GPIO21
  pin_scl: GPIO22

esphome:
  name: clock
  friendly_name: esp
  name_add_mac_suffix: true
  project:
    name: esphome.clock
    version: "1.0"
  on_boot:
    then:
      ds1307.read_time:

esp32:
  board: esp32dev

api:
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80
  version: 3
  local: true

logger:
  level: DEBUG

external_components:
  - source:
      #type: local
      #path: EsphoMaTrix/components # e.g. /config/esphome/components
      type: git
      url: https://github.com/lubeda/EspHoMaTriXv2
      ref: 2025.6.1
    refresh: 60s
    components: [ehmtxv2]

# Zeitsynchronisation
time:
  - platform: sntp
    id: time_ntp
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 0.europe.pool.ntp.org
      - 1.europe.pool.ntp.org
    on_time_sync:
      then:
        ds1307.write_time:
  #  - platform: homeassistant
  #    id: time_ha
  #    timezone: "Europe/Berlin"
  - platform: ds1307
    update_interval: never
    id: time_rtc

i2c:
  sda: $pin_sda
  scl: $pin_scl
  scan: true
  id: bus_i2c

# GY-6180 Lichtsensor (BH1750)
sensor:
  - platform: bh1750
    address: 0x23
    name: "Light Sensor"
    update_interval: 10s
    id: bh1750_sensor
  - platform: bme280_i2c
    temperature:
      name: "Temperature"
    pressure:
      name: "Pressure"
    humidity:
      name: "Humidity"
  - platform: adc
    pin: GPIO33
    name: "Battery"
    id: battery_voltage
    update_interval: 10s
    device_class: battery
    accuracy_decimals: 0
    attenuation: auto
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15
          send_first_at: 1
      - multiply: 1.6
      - lambda: |-
          return ((x - 3) / 0.69 * 100.00);
    unit_of_measurement: "%"

# I2S-Mikrofon (INMP441)
i2s_audio:
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
  i2s_mclk_pin: GPIO32
microphone:
  - platform: i2s_audio
    id: external_mic
    adc_type: external
    i2s_din_pin: GPIO27

light:
  - platform: neopixelbus
    id: light_ehmtx
    #    name: "RGB Matrix"
    type: GRB
    variant: WS2812
    pin: GPIO23
    num_leds: 192
    restore_mode: ALWAYS_OFF
    on_turn_on:
      lambda: |-
        id(display_ehmtx)->set_enabled(false);
    on_turn_off:
      lambda: |-
        id(display_ehmtx)->set_enabled(true);

# Taster
binary_sensor:
  - platform: gpio
    pin: GPIO34
    name: "Button Left"
  #    on_press:
  #      - light.toggle: "RGB Matrix"

  - platform: gpio
    pin: GPIO35
    name: "Button Right"
#    on_press:
#      - light.effect: "RGB Matrix"

font:
  - file: gfonts://Roboto
    size: 16
    id: default_font
#    glyphs: |
#      !?"%()+*=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnÖÄÜöäüopqrstuvwxyz@<>ß§€/

display:
  - platform: addressable_light
    id: display_ehmtx
    addressable_light_id: light_ehmtx
    width: 24
    height: 8
    pixel_mapper: |-
      if (y % 2 == 0) {
        return (y * 24) + x;
      }
      return (y * 24) + (23 - x);
    rotation: 90°
    update_interval: 16ms
    auto_clear_enabled: true
    lambda: |-
      id(rgb8x24)->tick();
      id(rgb8x24)->draw();

ehmtxv2:
  id: rgb8x24
  #  icons2html: true
  matrix_component: display_ehmtx
  time_component: time_rtc
  time_format: "%H:%M"
  date_format: "%d.%m."
  show_seconds: false
  week_start_monday: true # default monday is first day of week, false = sunday
  default_font_id: default_font
  default_font_yoffset: 8
  special_font_id: default_font
  special_font_yoffset: 8
  icons:
    - id: error
      lameid: 40530
  #    - id: home_assistant
  #      lameid: 47693
