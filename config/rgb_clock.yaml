esphome:
  name: clock
  friendly_name: esp
  project:
    name: esphome.clock
    version: "1.0"

esp32:
  board: esp32dev

api:
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80
  version: 3
  local: true

logger:
  level: DEBUG

# Zeitsynchronisation über Home Assistant
time:
  - platform: sntp
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 0.europe.pool.ntp.org
      - 1.europe.pool.ntp.org
  - platform: homeassistant
    id: ha_time
    timezone: "Europe/Berlin"

# I2C Bus für GY-6180 (BH1750)
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: bus_i2c

# GY-6180 Lichtsensor (BH1750)
sensor:
  - platform: bh1750
    address: 0x23
    name: "Helligkeitssensor"
    update_interval: 10s
    id: bh1750_sensor

# I2S-Mikrofon (INMP441)
i2s_audio:
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
  i2s_mclk_pin: GPIO32
microphone:
  - platform: i2s_audio
    id: external_mic
    adc_type: external
    i2s_din_pin: GPIO27

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: GPIO16
    num_leds: 192
    name: "RGB Matrix"

# Taster
binary_sensor:
  - platform: gpio
    pin: GPIO17
    name: "Button 1"
  #    on_press:
  #      - light.toggle: "RGB Matrix"

  - platform: gpio
    pin: GPIO18
    name: "Button 2"
#    on_press:
#      - light.effect: "RGB Matrix"
