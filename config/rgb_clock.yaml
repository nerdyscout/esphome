light:
  - platform: neopixelbus
    id: light_ehmtx
    #    name: "RGB Matrix"
    type: GRB
    variant: WS2812
    pin: $pin_leds
    num_leds: 192
    color_correct: [30%, 30%, 30%]
    restore_mode: ALWAYS_OFF
    on_turn_on:
      lambda: |-
        id(display_ehmtx)->set_enabled(true);
    on_turn_off:
      lambda: |-
        id(display_ehmtx)->set_enabled(false);
#    effects:
#      - wled:

# external components for LED effects
#wled:

display:
  - platform: addressable_light
    id: display_ehmtx
    addressable_light_id: light_ehmtx
    width: 24
    height: 8
    pixel_mapper: |-
      return (x * 8) + y;
    rotation: 0
    update_interval: 16ms
    auto_clear_enabled: true
    lambda: |-
      id(rgb8x24)->tick();
      id(rgb8x24)->draw();
#      it.rectangle(2, 3, 4, 5);
#      it.print(1, -2, id(font_default), "Hello");
