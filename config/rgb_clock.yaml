substitutions:
  pin_leds: GPIO18
  pin_buzzer: GPIO16
  pin_battery: GPIO34
  pin_power: GPIO33
  pin_button_left: GPIO26
  pin_button_right: GPIO14
  pin_sda: GPIO21
  pin_scl: GPIO22
  mic_lrclk_pin: GPIO25 # left/right --> GND
  mic_bclk_pin: GPIO27 # CLK
  mic_din_pin: GPIO32 # SD

esphome:
  name: clock
  friendly_name: esp
  name_add_mac_suffix: true
  project:
    name: esphome.clock
    version: "1.0"
  on_boot:
    then:
      ds1307.read_time:

esp32:
  board: esp32dev

api:
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap: {}
captive_portal:
web_server:
  port: 80
  version: 3
  local: true

logger:
  level: DEBUG

external_components:
  - source:
      type: git
      url: https://github.com/lubeda/EspHoMaTriXv2
      ref: 2025.5.1
    refresh: 60s
    components: [ehmtxv2]

# Zeitsynchronisation
time:
  - platform: sntp
    id: time_ntp
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 0.europe.pool.ntp.org
      - 1.europe.pool.ntp.org
    on_time_sync:
      then:
        ds1307.write_time:
  - platform: ds1307
    update_interval: never
    id: time_rtc

i2c:
  sda: $pin_sda
  scl: $pin_scl
  scan: true
  id: bus_i2c

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: uptime
    type: seconds
    name: Uptime Sensor
  # GY-6180 Lichtsensor (BH1750)
  #  - platform: bh1750
  #    address: 0x23
  #    name: "Light Sensor"
  #    update_interval: 10s
  #    id: bh1750_sensor
  # Env Sensor (BME280)
  #  - platform: bme280_i2c
  #    temperature:
  #      name: "Temperature"
  #    pressure:
  #      name: "Pressure"
  #    humidity:
  #      name: "Humidity"
  # Power
  - platform: adc
    pin: $pin_power
    name: "VCC"
    id: voltage_power
    update_interval: 10s
    device_class: power
    accuracy_decimals: 2
    attenuation: auto
  # Battery
  - platform: adc
    pin: $pin_battery
    name: "Battery"
    id: voltage_battery
    update_interval: 10s
    device_class: battery
    accuracy_decimals: 0
    attenuation: auto
    #    filters:
    #      - sliding_window_moving_average:
    #          window_size: 6
    #          send_every: 6
    #          send_first_at: 1
    #      - lambda: |-
    #          return map(x, 0, 4096, 0, 100);
#    unit_of_measurement: "%"

# I2S-Mikrofon (INMP441)
i2s_audio:
  i2s_lrclk_pin: $mic_lrclk_pin # The GPIO pin to use for the I²S LRCLK (Left/Right Clock) signal, also referred to as WS (Word Select) or FS (Frame Sync).
  i2s_bclk_pin: $mic_bclk_pin # The GPIO pin to use for the I²S BCLK (Bit Clock) signal, also referred to as SCK (Serial Clock).
#  i2s_mclk_pin: $mic_mclk_pin # The GPIO pin to use for the I²S MCLK (Master Clock) signal.
microphone:
  - platform: i2s_audio
    id: mic_external
    adc_type: external
    i2s_din_pin: $mic_din_pin # The GPIO pin to use for the I²S DIN/SDIN (Data In) signal, also referred to as SD/SDATA (Serial Data) or ADCDAT (Analog to Digital Converter Data).
voice_assistant:
  microphone: mic_external

# Taster
binary_sensor:
  - platform: gpio
    name: "Button Left"
    pin:
      number: $pin_button_left
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
  - platform: gpio
    name: "Button Right"
    pin:
      number: $pin_button_right
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

font:
  - file: Calcium.ttf
    #  - file: mateine.ttf
    #  - file: gfonts://Roboto
    size: 12
    id: default_font
#    glyphs: |
#      !?"%()+*=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnÖÄÜöäüopqrstuvwxyz@<>ß§€/

light:
  - platform: neopixelbus
    id: light_ehmtx
    #    name: "RGB Matrix"
    type: GRB
    variant: WS2812
    pin: $pin_leds
    num_leds: 192
    restore_mode: ALWAYS_OFF
#    on_turn_on:
#      lambda: |-
#        id(display_ehmtx)->set_enabled(false);
#    on_turn_off:
#      lambda: |-
#        id(display_ehmtx)->set_enabled(true);

display:
  - platform: addressable_light
    id: display_ehmtx
    addressable_light_id: light_ehmtx
    width: 24
    height: 8
    pixel_mapper: |-
      return (x * 8) + y;
    rotation: 0
    update_interval: 16ms
    auto_clear_enabled: true
    lambda: |-
      Color red = Color(0xFF0000);
      it.rectangle(0, 0, 3, 2, red);
      it.print(0, 0, id(default_font), "HALLO");
#      Color green = Color(0x00FF00);
#      it.rectangle(4, 4, 24, 8, green);

ehmtxv2:
  id: rgb8x24
  #  icons2html: true
  matrix_component: display_ehmtx
  time_component: time_rtc
  time_format: "%H:%M"
  date_format: "%d.%m."
  show_seconds: false
  week_start_monday: true # default monday is first day of week, false = sunday
  default_font_id: default_font
  default_font_yoffset: 0
  special_font_id: default_font
  special_font_yoffset: 0
  icons:
    - id: error
      lameid: 40530
  #    - id: home_assistant
  #      lameid: 47693
  #    - id: temperature
  #      lameid: 2056
  #    - id: lightbulb
  #      lameid: 1762
  #    - id: music
  #      lameid: 45625
  #    - id: ha
  #      lameid: 7956
  #    - id: tempc
  #      lameid: 2422
  #    - id: plug
  #      lameid: 403
  #    - id: humidity
  #      lameid: 51764
  #    - id: co2
  #      lameid: 30662
  #    - id: phone
  #      lameid: 1232
  #    - id: car
  #      lameid: 2819
  #    - id: sleep8x32
  #      url: https://user-images.githubusercontent.com/16407309/224850723-634c9b2d-55d9-44f2-9f93-765c0485b090.gif
  on_next_screen:
    - homeassistant.event:
        event: esphome.new_screen
        data_template:
          iconname: !lambda "return icon.c_str();"
          text: !lambda "return text.c_str();"

switch:
  - platform: template
    name: "Display"
    id: displaycontrol
    icon: "mdi:power"
    restore_mode: ALWAYS_ON
    lambda: |-
      return id(rgb8x24)->show_display;
    turn_on_action:
      lambda: |-
        id(rgb8x24)->set_display_on();
    turn_off_action:
      lambda: |-
        id(rgb8x24)->set_display_off();

