ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap: {}
captive_portal:
web_server:
  port: 80
  version: 3
  local: true

debug:
logger:
  level: VERBOSE

external_components:
  - source:
      type: git
      url: https://github.com/lubeda/EspHoMaTriXv2
      ref: 2025.5.2
    refresh: 60s
    components: [ehmtxv2]

globals:
  - id: night_mode
    type: "bool"
    restore_value: true
    initial_value: "false"

# Zeitsynchronisation
time:
  - platform: sntp
    id: time_ntp
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 0.europe.pool.ntp.org
      - 1.europe.pool.ntp.org
    on_time_sync:
      then:
        ds1307.write_time:
  - platform: ds1307
    id: time_rtc
    timezone: Europe/Berlin
    update_interval: never
    on_time:
      # Every morning
      - seconds: 0
        hours: 7
        minutes: 30
        then:
          - lambda: |
              id(night_mode) = false;
      # Every morning
      - seconds: 0
        hours: 21
        minutes: 30
        then:
          - lambda: |-
              id(night_mode) = true;

i2c:
  sda: $pin_sda
  scl: $pin_scl
  scan: true
#  id: bus_i2c
#  frequency: 10kHz

sensor:
  # Reports the WiFi signal strength/RSSI in dB
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: uptime
    type: seconds
    name: Uptime Sensor
  # Env Sensor (BME280)
  - platform: bme280_i2c
    id: bme
    address: 0x76
    temperature:
      name: "Temperature"
    pressure:
      name: "Pressure"
    humidity:
      name: "Humidity"

  # Power
  - platform: adc
    pin: $pin_power
    name: "Power Voltage"
    id: voltage_power
    update_interval: 10s
    device_class: power
    accuracy_decimals: 1
    attenuation: auto
  # Battery
  - platform: adc
    pin: $pin_battery
    name: "Power Battery"
    id: voltage_battery
    update_interval: 10s
    device_class: battery
    unit_of_measurement: "V"
    accuracy_decimals: 1
    attenuation: auto
    filters:
      - multiply: 3.1277 # Voltage divider compensation (147k/47k = 3.1277 + tolerance)
      - sliding_window_moving_average:
          window_size: 10
          send_every: 5
          send_first_at: 3
#  - platform: template
#    name: "Power Battery Percentage"
#    id: battery_percentage
#    unit_of_measurement: "%"
#    accuracy_decimals: 0
#    update_interval: 30s
#    lambda: |-
#      float voltage = id(voltage_battery).state;
#      // For two 18650 cells in series:
#      // Empty voltage ~6.0V (0%)
#      // Full voltage ~8.4V (100%)
#      if (voltage >= 8.4) return 100;
#      if (voltage <= 6.0) return 0;
#      return (voltage - 6.0) / (8.4 - 6.0) * 100.0;

#    unit_of_measurement: "%"
