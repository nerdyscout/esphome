  #      lameid: 7956
  #    - id: tempc
  #      lameid: 2422
  #    - id: plug
  #      lameid: 403
  #    - id: humidity
  #      lameid: 51764
  #    - id: co2
  #      lameid: 30662
  #    - id: phone
  #      lameid: 1232
  #    - id: car
  #      lameid: 2819
