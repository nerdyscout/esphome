esphome:
  name: rgb-pixel-clock
  friendly_name: esp
#  board: esp32dev
#  project:
#    name: esphome.fan
#    version: "1.0"
esp32:
  board: esp32dev
#  framework:
#    type: esp-idf

api:
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80
  version: 3
  local: true

logger:
  level: DEBUG

# Zeitsynchronisation über Home Assistant
time:
  - platform: sntp
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 0.europe.pool.ntp.org
      - 1.europe.pool.ntp.org
  - platform: homeassistant
    id: ha_time
    timezone: "Europe/Berlin"

# I2C Bus für GY-6180 (BH1750)
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: bus_i2c

# GY-6180 Lichtsensor (BH1750)
sensor:
  - platform: bh1750
    address: 0x23
    name: "Helligkeitssensor"
    update_interval: 10s
    #    resolution: 4 # 1-4 (0.5-16lx Auflösung)
    id: bh1750_sensor

