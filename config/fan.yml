esphome:
  name: fan
  friendly_name: esp
  name_add_mac_suffix: true

esp8266:
  board: nodemcuv2

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:

web_server:
  port: 80
  version: 3
  local: true

#mqtt:
#  broker: !secret mqtt_broker
#  username: !secret mqtt_username
#  password: !secret mqtt_password
#  discovery: true

logger:
  level: DEBUG

time:
  - platform: sntp
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 0.europe.pool.ntp.org
      - 1.europe.pool.ntp.org

fan:
  - platform: binary
    name: Level 1
    id: level1
    output: power1
    on_turn_on:
      then:
        - fan.turn_off: level2
        - fan.turn_off: level3
  - platform: binary
    name: Level 2
    id: level2
    output: power2
    on_turn_on:
      then:
        - fan.turn_off: level1
        - fan.turn_off: level3
  - platform: binary
    name: Level 3
    id: level3
    output: power3
    on_turn_on:
      then:
        - fan.turn_off: level1
        - fan.turn_off: level2

# output
output:
  - platform: gpio
    id: power1
    pin: GPIO4
  - platform: gpio
    id: power2
    pin: GPIO5
  - platform: gpio
    id: power3
    pin: GPIO2

# inputs
binary_sensor:
  - platform: gpio
    id: button1
    name: Button 1
    device_class: power
    pin:
      number: GPIO12
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_press:
      then:
        fan.turn_on: level1
    on_release:
      then:
        fan.turn_off: level1

  - platform: gpio
    id: button2
    name: Button 2
    device_class: power
    pin:
      number: GPIO13
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_press:
      then:
        fan.turn_on: level2
    on_release:
      then:
        fan.turn_off: level2

  - platform: gpio
    id: button3
    name: Button 3
    device_class: power
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_press:
      then:
        fan.turn_on: level3
    on_release:
      then:
        fan.turn_off: level3

i2c:
  sda: GPIO10
  scl: GPIO9
  scan: true

sensor:
  - platform: bmp280_i2c
    temperature:
      id: temperature
      name: "Temperature"
      oversampling: 16x
    pressure:
      name: "Pressure"
    update_interval: 30s

  - platform: template
    name: "Fan Auto Control"
    lambda: |-
      if (id(temperature).state >= id(level3_setpoint).state && id(level3_setpoint).state > id(level2_setpoint).state && id(level3_setpoint).state > id(level1_setpoint).state ) {
        return 3;
      } else if (id(temperature).state >= id(level2_setpoint).state && id(level2_setpoint).state >= id(level1_setpoint).state && id(level2_setpoint).state >= id(level3_setpoint).state) {
        return 2;
      } else if (id(temperature).state >= id(level1_setpoint).state && id(level1_setpoint).state >= id(level2_setpoint).state && id(level1_setpoint).state >= id(level3_setpoint).state) {
        return 1;
      } else {
        return 0;
      }
    update_interval: 10s
    on_value:
      then:
        - if:
            condition:
              lambda: "return x == 3;"
            then:
              - fan.turn_on: level3
              - fan.turn_off: level2
              - fan.turn_off: level1
        - if:
            condition:
              lambda: "return x == 2;"
            then:
              - fan.turn_on: level2
              - fan.turn_off: level1
              - fan.turn_off: level3
        - if:
            condition:
              lambda: "return x == 1;"
            then:
              - fan.turn_on: level1
              - fan.turn_off: level2
              - fan.turn_off: level3
        - if:
            condition:
              lambda: "return x == 0;"
            then:
              - fan.turn_off: level1
              - fan.turn_off: level2
              - fan.turn_off: level3

number:
  - platform: template
    name: "Fan Level 1 Temperature Setpoint"
    id: level1_setpoint
    min_value: 10
    max_value: 40
    step: 1
    initial_value: 20
    optimistic: true

  - platform: template
    name: "Fan Level 2 Temperature Setpoint"
    id: level2_setpoint
    min_value: 10
    max_value: 40
    step: 1
    initial_value: 25
    optimistic: true

  - platform: template
    name: "Fan Level 3 Temperature Setpoint"
    id: level3_setpoint
    min_value: 10
    max_value: 40
    step: 1
    initial_value: 30
    optimistic: true
