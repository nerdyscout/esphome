font:
  - file: mateine.ttf
    size: 16
    id: font_mateine
    glyphs: '!?"%()+*=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyzÖÄÜöäü@<>ß§€/'

light:
  - platform: neopixelbus
    id: light_ehmtx
    name: Display
    type: GRB
    variant: WS2812
    pin: $pin_leds
    num_leds: 192
    color_correct: [30%, 30%, 30%]
    restore_mode: ALWAYS_OFF
    icon: mdi:power
    on_turn_on:
      lambda: |-
        id(display_ehmtx)->set_enabled(true);
    on_turn_off:
      lambda: |-
        id(display_ehmtx)->set_enabled(false);

display:
  - platform: addressable_light
    id: display_ehmtx
    addressable_light_id: light_ehmtx
    width: 24
    height: 8
    pixel_mapper: |-
      return (23-x) * 8 + y;
    rotation: 0
    update_interval: 16ms
    auto_clear_enabled: true
    lambda: |-
      id(rgb8x24)->tick();
      id(rgb8x24)->draw();

ehmtxv2:
  id: rgb8x24
  matrix_component: display_ehmtx
  time_component: time_rtc
  time_format: "%H:%M"
  date_format: "%d.%m."
  show_seconds: false
  week_start_monday: true
  default_font_id: font_mateine
  default_font_yoffset: 8
  special_font_id: font_mateine
  special_font_yoffset: 6
  show_dow: false
  brightness: 100
  icons:
    - id: error
      lameid: 40530
    # - id: home_assistant
    #   lameid: 47693
    #- id: temperature
    #  lameid: 2056
    # - id: humidity
    #   lameid: 51764
    # - id: weather_clear_night
    #   lameid: 53383
    # - id: weather_cloudy
    #   frame_duration: 192
    #   lameid: 25991
    # - id: weather_exceptional
    #   lameid: 16754
    # - id: weather_fog
    #   lameid: 52167
    # - id: weather_hail
    #   lameid: 53288
    # - id: weather_lightning
    #   lameid: 23713
    # - id: weather_lightning_rainy
    #   lameid: 49299
    # - id: weather_partlycloudy
    #   frame_duration: 210
    #   lameid: 22160
    # - id: weather_pouring
    #   lameid: 49300
    # - id: weather_rainy
    #   lameid: 26565
    # - id: weather_snowy
    #   lameid: 2289
    # - id: weather_snowy_rainy
    #   lameid: 49301
    # - id: weather_sunny
    #   lameid: 11201
    # - id: weather_windy
    #   lameid: 15618
    # - id: weather_windy_variant
    #   lameid: 15618
    # - id: weather_cloudy_night
    #   lameid: 12195

  # on_next_screen:
  #   - homeassistant.event:
  #       event: esphome.new_screen
  #       data_template:
  #         iconname: !lambda "return icon.c_str();"
  #         text: !lambda "return text.c_str();"

  on_empty_queue:
    then:
      lambda: |-
        std::string temp_str;
        const int max=200;
        int r=max,g=max,b=max;

        // date
        temp_str = id(time_rtc).now().strftime("%d/%m");
        id(rgb8x24)->text_screen(temp_str,20,10,max,max,max);

        // time
        temp_str = id(time_rtc).now().strftime("%H:%M");
        id(rgb8x24)->text_screen(temp_str,20,10,max,max,max);

        // temperature
        float temp_value = id(bme_temperature).state;
        temp_str = std::to_string((int)temp_value) + "°C";
        // Map temperature from -10°C (blue) to 40°C (red)
        float t = (temp_value + 10.0f) / 50.0f;
        if (t < 0.0f) t = 0.0f;
        if (t > 1.0f) t = 1.0f;
        b = (int)((1.0f - t) * max);
        r = (int)(t * max);
        id(rgb8x24)->text_screen(temp_str,20,10,r,0,b);

switch:
  # - platform: template
  #   name: "Display"
  #   turn_on_action:
  #     lambda: |-
  #       id(rgb8x24)->set_display_on();
  #   turn_off_action:
  #     lambda: |-
  #       id(rgb8x24)->set_display_off();

  - platform: template
    name: "Auto-Adjust Brightness"
    id: switch_autobrightness
    icon: mdi:brightness-auto
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      if (id(aab_enable)) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      lambda: |-
        id(aab_enable) = true;
    turn_off_action:
      lambda: |-
        id(aab_enable) = false;

